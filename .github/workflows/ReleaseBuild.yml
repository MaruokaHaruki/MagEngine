name: ReleaseBuild

on:
  push:
    branches:
      - master

    # v1.0.0 のようなタグpush時にも実行
    tags:
      - 'v*'

  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: MagEngine.sln
  CONFIGURATION: Release
  PLATFORM: x64

  # VS2026 / MSVC 145
  TOOLSET: v145

  # Windows SDK固定
  WINDOWS_SDK_VERSION: 10.0.26100.0

jobs:

  build:

    # Visual Studio 2026 環境
    runs-on: windows-2025-vs2026

    steps:

      # ソース取得
      - name: Checkout
        uses: actions/checkout@v4

      # NuGetキャッシュ
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages

          # packages.config ベース想定
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}

          restore-keys: |
            ${{ runner.os }}-nuget-

      # MSBuildセットアップ
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # NuGet Restore
      - name: Restore
        run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

      # Releaseビルド
      - name: Build Release
        run: |
          msbuild $env:SOLUTION_FILE_PATH `
            /m `
            /p:Configuration=$env:CONFIGURATION `
            /p:Platform=$env:PLATFORM `
            /p:PlatformToolset=$env:TOOLSET `
            /p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK_VERSION

      # Artifact保存
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MagEngine-Release
          path: |
            **/x64/Release/
            !**/*.pdb

      # GitHub Release作成
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

          files: |
            **/x64/Release/*.exe
            **/x64/Release/*.dll